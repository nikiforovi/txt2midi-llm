[project]
name = "txt2midi"
version = "0.1.0"
description = "Text-to-MIDI Music Generator Baseline"
authors = [
    {name = "Ilya"} # email moved to .env
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "miditoolkit (>=1.0.1,<2.0.0)",
    "pretty-midi (>=0.2.11,<0.3.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "mido (>=1.3.3,<2.0.0)",
    "protobuf (>=4.21.0)",
    "sentencepiece (>=0.1.99)",
    "tiktoken (>=0.7.0)",
    "datasets (>=2.18.0)",
    "huggingface_hub (>=0.21.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
